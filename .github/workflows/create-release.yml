name: Create release

# Shared by avo-hq/avo and avo-hq/workspace, both at `@main`, so everything
# here must preserve each caller's behaviour — and it takes no inputs, because
# a reusable workflow is called at the job level: the caller cannot run a step
# first, so it could never hand this job a file. The tag's shape decides the
# path instead:
#
#   v4.1.3            one release stream (avo core) — build the body from the
#                     repository's matching draft, as before
#   avo-menu-v4.1.2   one stream per gem (the monorepo) — compute the body for
#                     exactly that gem's tag range and attach its payload
#
# The package path runs `ws` from the checkout. In a reusable workflow the
# checkout is the *calling* repository, so when the workspace calls this the
# tree already carries `ws` with its dependencies vendored — no cross-repo
# credential and no second implementation of the notes logic. A caller without
# `ws` never enters that path: the guard keeps an unexpected `*-v*` tag from a
# ws-less repository on the draft path rather than failing its release.

on:
  workflow_call:
    secrets:
      REFRESH_RELEASES_SECRET:
        required: true
      # Optional: without them the release still publishes, and only the
      # announcement below is skipped. A caller that has never been given the
      # App's credentials therefore keeps working unchanged.
      WORKFLOW_BOT_APP_ID:
        required: false
      WORKFLOW_BOT_APP_PRIVATE_KEY:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # gh pr view reads each PR in the tag range for the release notes.
      # Declaring any permission zeroes the rest, and without this one every
      # lookup died with "Resource not accessible by integration" — swallowed
      # per-PR, publishing "No customer-facing changes" on a release that had
      # them (avo-dynamic_filters v4.1.2).
      pull-requests: read
    steps:
      # Full history with tags: the package path bounds its range at the same
      # package's previous tag, and a shallow checkout would leave nothing to
      # search — ws release-notes fails loudly on that rather than guessing.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect the tag shape
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" =~ ^(.+)-v([0-9].*)$ ]] && [ -x ./ws ]; then
            echo "package=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "version=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          else
            echo "package=" >> "$GITHUB_OUTPUT"
          fi

      - uses: ruby/setup-ruby@v1
        if: steps.detect.outputs.package != ''
        with:
          ruby-version-file: .ruby-version

      # `ws` vendors its only dependencies, so no bundler and no gem installs.
      # The event id is the tagged commit: `ws release` commits once and tags
      # every bumped gem on that commit, so tags pushed together share it —
      # which is what lets the announcement layer treat them as one event.
      - name: Compute the notes for this package
        if: steps.detect.outputs.package != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ steps.detect.outputs.package }}
          VERSION: ${{ steps.detect.outputs.version }}
        run: |
          set -euo pipefail
          ./ws release-notes \
            --package "$PACKAGE" \
            --version "$VERSION" \
            --event-id "$GITHUB_SHA" \
            --out "$RUNNER_TEMP/release-notes"
          cp "$RUNNER_TEMP/release-notes/notes.md" "$RUNNER_TEMP/release-body.md"

      # Draft path, for the single-stream caller. Narrowed to the draft whose
      # tag matches the pushed one: `find(r => r.draft)` took whichever draft
      # was first, which is correct with one release stream and silently wrong
      # anywhere a second draft can exist.
      - name: Get release notes from the draft
        if: steps.detect.outputs.package == ''
        uses: actions/github-script@v7
        id: draft_notes
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '')
            const {data: releases} = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
            })
            const drafts = releases.filter((r) => r.draft)
            const match = drafts.find((r) => r.tag_name === tag) || drafts[0]
            return match?.body || `Release ${tag}`

      - name: Stage the draft body
        if: steps.detect.outputs.package == ''
        shell: bash
        env:
          DRAFT_BODY: ${{ steps.draft_notes.outputs.result }}
        run: |
          set -euo pipefail
          # github-script returns a JSON string; unwrap it with jq rather than
          # interpolating the body into a shell word.
          printf '%s' "$DRAFT_BODY" | jq -r . > "$RUNNER_TEMP/release-body.md"

      # `gh release create` rather than actions/create-release@v1: the action
      # is archived, hardcodes prerelease:false, and has no asset input at all,
      # so the payload could not be attached through it. One call handles the
      # body file, the prerelease flag, and the asset upload — and reading the
      # body from a file keeps PR-derived text out of every workflow expression
      # and shell word.
      #
      # A release that already exists is left alone, so dispatching this
      # workflow again for a published tag re-runs only the steps after it —
      # the announcement and the avohq.io refresh — instead of failing here.
      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.detect.outputs.tag }}
          PACKAGE: ${{ steps.detect.outputs.package }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists — leaving it as is." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          args=("$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/release-body.md")
          if [ -n "$PACKAGE" ]; then
            payload="$RUNNER_TEMP/release-notes/release.json"
            if [ "$(jq -r '.prerelease' "$payload")" = "true" ]; then
              args+=(--prerelease)
            fi
            args+=("$payload")
          fi
          gh release create "${args[@]}"

      # Tell the people who reported a fix that it shipped. Both paths need a
      # credential GITHUB_TOKEN cannot give them: the package path comments on
      # issues that live in another repository, and the core path has to reach
      # into the private monorepo. The App both callers already use for
      # cross-repo work mints it. Everything here is skipped without the
      # secrets, and the release itself never depends on it.
      - name: Check for cross-repo credentials
        id: credentials
        shell: bash
        env:
          APP_ID: ${{ secrets.WORKFLOW_BOT_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.WORKFLOW_BOT_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No App credentials here — skipping the release announcement." >> "$GITHUB_STEP_SUMMARY"
          fi

      # continue-on-error, so an App that is not installed on one of these
      # repositories leaves a published release green instead of red. The
      # guards below read the outcome rather than assuming a token exists.
      - name: Generate GitHub App token
        id: app-token
        if: steps.credentials.outputs.available == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.WORKFLOW_BOT_APP_ID }}
          private-key: ${{ secrets.WORKFLOW_BOT_APP_PRIVATE_KEY }}
          owner: avo-hq
          repositories: |
            avo
            workspace

      # Package path: the payload this run just built names every issue the
      # range's PRs closed. `ws announce` is idempotent on the event id — the
      # tagged commit — so a re-run, or a second gem tagged from the same
      # commit, posts nothing twice. continue-on-error, like every step of the
      # announcement: a failure here must not skip the avohq.io publish below.
      - name: Announce the issues this release closed
        if: steps.detect.outputs.package != '' && steps.app-token.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: ./ws announce --payload "$RUNNER_TEMP/release-notes/release.json"

      # Core path: this repository has no `ws` to build a payload with, so the
      # monorepo — which does — is asked to do it. Only the tag travels; the
      # workspace resolves the rest from the public repository.
      #
      # workflow_dispatch rather than repository_dispatch: the latter needs
      # Contents: write on the monorepo — push access — while this needs only
      # Actions: write. With repository_dispatch the App's 403 failed v4.2.7's
      # run and skipped its avohq.io publish.
      - name: Ask the monorepo to announce this core release
        if: steps.detect.outputs.package == '' && github.repository == 'avo-hq/avo' && steps.app-token.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.detect.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run announce-core.yml \
            --repo avo-hq/workspace \
            --ref main \
            -f "tag=$TAG"
          echo "Asked avo-hq/workspace to announce $TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release on avohq.io
        shell: bash
        env:
          REFRESH_RELEASES_SECRET: ${{ secrets.REFRESH_RELEASES_SECRET }}
        run: |
          curl -X GET "https://avohq.io/releases/refresh_releases?secret=$REFRESH_RELEASES_SECRET"
          echo "Release published on avohq.io"
