name: Create release

# Shared by avo-hq/avo and avo-hq/workspace. Both call it at `@main`, so a
# change here reaches both release paths the moment it merges — every input
# below is optional and every default preserves today's behaviour.
#
# Two callers, two shapes of tag. Core pushes `v4.1.3` and has one release
# stream, so the draft-finding path below still serves it. The workspace pushes
# `avo-menu-v4.1.2` and has one stream per gem, so it computes its notes ahead
# of time and passes them in.
on:
  workflow_call:
    inputs:
      notes_file:
        description: >-
          Path to a file holding the release body. A path, never the text: the
          body is assembled from PR titles and author-written note lines, so
          interpolating it into an expression or a shell word would let a
          crafted PR title run commands on this runner.
        required: false
        type: string
      payload_file:
        description: Path to release.json, uploaded as a release asset for HQ and the rollup to read.
        required: false
        type: string
      has_notes:
        description: >-
          Whether the caller supplied notes. Gated on this rather than on
          notes_file being non-empty: a release whose tag range holds no
          labelled PRs produces a short but valid body, and treating that as
          "no notes" would fall back to the repository-wide draft — notes
          belonging to other gems.
        required: false
        type: boolean
        default: false
      prerelease:
        description: Mark the GitHub release as a prerelease.
        required: false
        type: boolean
        default: false
    secrets:
      REFRESH_RELEASES_SECRET:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Only for callers that did not compute their own notes. Narrowed to the
      # draft whose tag matches the one being pushed: `find(r => r.draft)` took
      # whichever draft happened to be first in the repository, which is correct
      # for a single-stream repo and silently wrong anywhere a second draft can
      # exist.
      - name: Get release notes from the draft
        if: ${{ !inputs.has_notes }}
        uses: actions/github-script@v7
        id: draft_notes
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '')
            const {data: releases} = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
            })
            const drafts = releases.filter((r) => r.draft)
            const match = drafts.find((r) => r.tag_name === tag) || drafts[0]
            return match?.body || `Release ${tag}`

      - name: Stage the release body
        shell: bash
        env:
          NOTES_FILE: ${{ inputs.notes_file }}
          DRAFT_BODY: ${{ steps.draft_notes.outputs.result }}
          HAS_NOTES: ${{ inputs.has_notes }}
        run: |
          set -euo pipefail
          if [ "$HAS_NOTES" = "true" ]; then
            cp "$NOTES_FILE" "$RUNNER_TEMP/release-body.md"
          else
            # github-script returns a JSON string; unwrap it with jq rather
            # than interpolating the body into a shell word.
            printf '%s' "$DRAFT_BODY" | jq -r . > "$RUNNER_TEMP/release-body.md"
          fi

      # `gh release create` replaces actions/create-release@v1, which is
      # archived, hardcodes prerelease:false, and has no asset input at all —
      # so the payload could not be attached through it. One call now handles
      # the body file, the prerelease flag, and the asset upload.
      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAYLOAD_FILE: ${{ inputs.payload_file }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          args=("$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/release-body.md")
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          if [ -n "${PAYLOAD_FILE:-}" ] && [ -f "$PAYLOAD_FILE" ]; then args+=("$PAYLOAD_FILE"); fi
          gh release create "${args[@]}"

      - name: Publish release on avohq.io
        shell: bash
        env:
          REFRESH_RELEASES_SECRET: ${{ secrets.REFRESH_RELEASES_SECRET }}
        run: |
          curl -X GET "https://avohq.io/releases/refresh_releases?secret=$REFRESH_RELEASES_SECRET"
          echo "Release published on avohq.io"
